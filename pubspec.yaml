name: azkar
description: "AZKAR | أذكار — صدقة جارية: a web-first Islamic content platform."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.2
  supabase_flutter: ^2.18.3
  # Local, per-visitor persistence. On the web sembast is backed by IndexedDB,
  # on Android/iOS it is backed by an app-private file.
  sembast: ^3.9.0
  sembast_web: ^2.4.6+1
  path_provider: ^2.1.6
  path: ^1.9.1
  url_launcher: ^6.3.3
  uuid: ^4.6.0
  web: ^1.1.2
  youtube_player_iframe: ^6.0.2
  intl: any
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  http: ^1.6.0

flutter:
  uses-material-design: true

  # The Arabic font binaries are intentionally declared as *assets* rather than
  # as `fonts:`. They are registered at runtime through FontLoader so the browser
  # only downloads the families that are actually displayed (see
  # lib/core/typography/arabic_font_loader.dart). Bundling all 10 families in the
  # `fonts:` section would force every visitor to download ~4.8 MB up front.
  assets:
    - assets/branding/
    - assets/data/
    - assets/fonts/amiri/
    - assets/fonts/cairo/
    - assets/fonts/tajawal/
    - assets/fonts/noto_naskh_arabic/
    - assets/fonts/noto_kufi_arabic/
    - assets/fonts/scheherazade_new/
    - assets/fonts/reem_kufi/
    - assets/fonts/lateef/
    - assets/fonts/aref_ruqaa/
    - assets/fonts/ibm_plex_sans_arabic/
